# XCalificator — Nginx Production Configuration
#
# Place this file at frontend/nginx.conf and symlink or copy it into
# your Nginx sites-available directory, e.g.:
#   sudo ln -sf /mnt/Calificator/frontend/nginx.conf /etc/nginx/sites-available/xcalificator
#   sudo ln -sf /etc/nginx/sites-available/xcalificator /etc/nginx/sites-enabled/
#
# Design principles:
#  - HTML: no long cache (Nginx etag/mtime-based revalidation)
#  - Assets with content hash: immutable cache (1 year)
#  - Compression: gzip on text assets
#  - Security headers: X-Content-Type-Options, Referrer-Policy, Permissions-Policy, CSP
#  - SPA fallback (try_files → index.html)
#  - Custom 404 page
#  - Proxy API / uploads / health to backend

upstream xali_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name _;

    root /opt/xcalificator/frontend/dist;
    index index.html;

    # ── Logging ─────────────────────────────────────────────────────────
    access_log /var/log/nginx/xcalificator_access.log;
    error_log  /var/log/nginx/xcalificator_error.log warn;

    # ── Compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        image/x-icon
        font/woff
        font/woff2;

    # ── Security headers ────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Content-Security-Policy
    #   Compatible with XCalificator, Presenton, and third-party APIs.
    #   'self' covers the app's own assets.
    #   img-src 'self' data: — for inline SVGs and data URIs.
    #   connect-src 'self' https://api.xali.app — adjust to your API origin.
    #   style-src 'self' 'unsafe-inline' — Tailwind/emotion inject inline styles.
    #   script-src 'self' — strict; no eval or inline scripts.
    #   font-src 'self' data: — self-hosted fonts via @fontsource.
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'sha256-8rEbVvLbIj2nfu8eWRg/wLDgvYT9MyBYjN3Lh2QSHjY=' 'sha256-bRN0+npVXhManCpmhgLcDwPulOk+b+c9gdWgMncQSlI=' https://static.cloudflareinsights.com;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:;
        font-src 'self' data:;
        connect-src 'self' https://api.xali.app wss://api.xali.app https://cloudflareinsights.com;
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
        object-src 'none';
        upgrade-insecure-requests;
    " always;

    # ── HTML: no long cache (validate with etag) ───────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # HTML should always be revalidated
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header ETag "XCal-$date_gmt" always;
        }
    }

    # ── Assets with content hash: immutable cache ──────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # ── Favicon: immutable cache ───────────────────────────────────────
    location = /favicon.svg {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }
    location = /favicon.png {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # ── Static files (robots, manifests, etc.) ─────────────────────────
    location ~* \.(svg|png|ico|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # ── API proxy ──────────────────────────────────────────────────────
    location ^~ /api/ {
        proxy_pass http://xali_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://xali_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://xali_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ── Custom error pages ─────────────────────────────────────────────
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }

    # ── Deny access to hidden files ────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Deny access to source maps in production ───────────────────────
    location ~* \.(map)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
