name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'

jobs:
  backend:
    name: Backend quality and tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: xcalificator_test
          POSTGRES_USER: xcalificator
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xcalificator -d xcalificator_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ENV: development
      SECRET_KEY: ci-secret-key-with-at-least-32-characters
      DATABASE_URL: postgresql+asyncpg://xcalificator:test-password@127.0.0.1:5432/xcalificator_test
      REDIS_URL: redis://127.0.0.1:6379/0
      RUN_DB_SMOKE: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Audit production dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run backend unit tests
        run: python -m pytest tests/unit -v

      - name: Run backend integration tests
        run: python -m pytest tests/integration -v

  frontend:
    name: Frontend quality, build and E2E
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=moderate --omit=dev

      - name: Type-check
        run: npm run typecheck

      - name: Lint with zero warnings
        run: npm run lint:strict

      - name: Run unit tests
        run: npm run test:run

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mocked end-to-end tests
        run: npm run test:e2e

      - name: Upload E2E diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            frontend/test-results/
            frontend/playwright-report/
            output/playwright/

  containers:
    name: Container builds
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: cp .env.example .env && docker compose --profile production config --quiet

      - name: Build backend image
        run: docker build -t xcalificator-backend ./backend

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t xcalificator-web .