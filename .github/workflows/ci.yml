name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  NPM_VERSION: '11.6.1'
  AUDITED_FRONTEND_LOCK_SHA256: '967158cfa53578c77d3ad90468d7ec8a812bef066492cf9e61778d2590b12a69'
  PYTHON_VERSION: '3.11'

jobs:
  backend:
    name: Backend quality and tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: xcalificator_test
          POSTGRES_USER: xcalificator
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xcalificator -d xcalificator_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      feedback-postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: spec107
          POSTGRES_USER: spec107
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 55417:5432
        options: >-
          --health-cmd "pg_isready -U spec107 -d spec107"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ENV: development
      SECRET_KEY: ci-secret-key-with-at-least-32-characters
      DATABASE_URL: postgresql+asyncpg://xcalificator:test-password@127.0.0.1:5432/xcalificator_test
      REDIS_URL: redis://127.0.0.1:6379/0
      RUN_DB_SMOKE: '1'
      SPEC031_TEST_DATABASE_URL: postgresql+asyncpg://xcalificator:test-password@127.0.0.1:5432/xcalificator_test
      SPEC061_TEST_DATABASE_URL: postgresql+asyncpg://xcalificator:test-password@127.0.0.1:5432/xcalificator_test
      SPEC084_TEST_DATABASE_URL: postgresql+asyncpg://xcalificator:test-password@127.0.0.1:5432/xcalificator_test
      SPEC085_TEST_DATABASE_URL: postgresql+asyncpg://xcalificator:test-password@127.0.0.1:5432/xcalificator_test
      SPEC101_TEST_DATABASE_URL: postgresql+asyncpg://xcalificator:test-password@127.0.0.1:5432/xcalificator_test
      SPEC104_TEST_DATABASE_URL: postgresql+asyncpg://xcalificator:test-password@127.0.0.1:5432/xcalificator_test
      SPEC107_TEST_DATABASE_URL: postgresql+asyncpg://spec107:synthetic-ci-only@127.0.0.1:55417/spec107
      SPEC116_TEST_DATABASE_URL: postgresql+asyncpg://xcalificator:test-password@127.0.0.1:5432/spec116
      SPEC128_TEST_DATABASE_URL: postgresql+asyncpg://xcalificator:test-password@127.0.0.1:5432/xcalificator_test
      SPEC133_TEST_DATABASE_URL: postgresql+asyncpg://xcalificator:test-password@127.0.0.1:5432/spec133
      SPEC134_TEST_DATABASE_URL: postgresql+asyncpg://xcalificator:test-password@127.0.0.1:5432/spec134
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install PDF rendering libraries for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangocairo-1.0-0 libharfbuzz0b libpangoft2-1.0-0 fonts-dejavu-core

      - name: Verify PDF rendering runtime
        run: >-
          python -c "from weasyprint import HTML; import fitz; data = HTML(string='<p>PDF CI 128</p>').write_pdf(); assert data.startswith(b'%PDF-'); document = fitz.open(stream=data, filetype='pdf'); assert document.page_count == 1 and 'PDF CI 128' in document[0].get_text(); document.close(); print('PDF runtime verified')"

      - name: Audit production dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Reject undefined names and unused backend code
        run: python -m ruff check --select F401,F821,F822,F823,F841 app tests

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Apply isolated feedback database migrations
        run: DATABASE_URL="$SPEC107_TEST_DATABASE_URL" alembic upgrade head

      - name: Prepare isolated compatible API database
        run: |
          psql postgresql://xcalificator:test-password@127.0.0.1:5432/xcalificator_test -c 'CREATE DATABASE spec116'
          DATABASE_URL="$SPEC116_TEST_DATABASE_URL" alembic upgrade head

      - name: Run backend unit tests
        run: python -m pytest tests/unit -v

      - name: Prepare isolated reading controls database
        run: |
          psql postgresql://xcalificator:test-password@127.0.0.1:5432/xcalificator_test -c 'CREATE DATABASE spec133'
          DATABASE_URL="$SPEC133_TEST_DATABASE_URL" alembic upgrade head

      - name: Prepare isolated direct-grade database
        # The fixture creates random schemas only in this empty synthetic DB.
        run: psql postgresql://xcalificator:test-password@127.0.0.1:5432/xcalificator_test -c 'CREATE DATABASE spec134'

      - name: Run backend integration tests
        run: python -m pytest tests/integration -v

      - name: Run isolated document converter contracts
        run: python -m pytest ../document-renderer/tests -v

  frontend-quality:
    name: Frontend quality and build
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use supported npm audit client
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        shell: bash
        run: |
          last_output=""
          for attempt in 1 2 3; do
            set +e
            last_output="$(npm audit --audit-level=moderate --omit=dev 2>&1)"
            audit_status=$?
            set -e
            printf '%s\n' "$last_output"
            if [ "$audit_status" -eq 0 ]; then
              exit 0
            fi
            if ! grep -q "503 Service Unavailable" <<< "$last_output"; then
              exit "$audit_status"
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          actual_lock_sha="$(sha256sum package-lock.json | cut -d ' ' -f 1)"
          if [ "$actual_lock_sha" = "$AUDITED_FRONTEND_LOCK_SHA256" ]; then
            echo "::warning::npm.org sigue en mantenimiento (503); se conserva el lockfile previamente auditado."
            exit 0
          fi
          echo "::error::No se permite omitir la auditoría: el lockfile cambió."
          exit 1

      - name: Type-check
        run: npm run typecheck

      - name: Lint with zero warnings
        run: npm run lint:strict

      - name: Run unit tests
        run: npm run test:run

      - name: Verify complete and non-overlapping E2E partitions
        run: node scripts/verify-e2e-shards.mjs 4

      - name: Build production bundle
        run: npm run build

  frontend-e2e-general:
    name: Frontend general shard (${{ matrix.shard }}/4)
    needs: frontend-quality
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use supported npm client
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run general end-to-end tests
        timeout-minutes: 30
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4 --reporter=line

      - name: Upload general E2E diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-general-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            frontend/test-results/
            frontend/playwright-report/
            output/playwright/

  frontend-e2e-contextual:
    name: Frontend contextual regressions
    needs: frontend-quality
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use supported npm client
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run contextual teacher flow regressions
        timeout-minutes: 25
        run: npm run test:mock -- grading-review.mock.spec.ts evaluation-visuals.mock.spec.ts --reporter=line

      - name: Upload E2E diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-contextual
          if-no-files-found: ignore
          retention-days: 7
          path: |
            frontend/test-results/
            frontend/playwright-report/
            output/playwright/

  frontend-e2e:
    name: Frontend E2E (${{ matrix.suite }})
    needs: [frontend-e2e-general, frontend-e2e-contextual]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        suite: [general, contextual]
    steps:
      - name: Require the complete suite
        env:
          SUITE: ${{ matrix.suite }}
          GENERAL: ${{ needs.frontend-e2e-general.result }}
          CONTEXTUAL: ${{ needs.frontend-e2e-contextual.result }}
        run: |
          set -eu
          case "$SUITE" in
            general) test "$GENERAL" = success ;;
            contextual) test "$CONTEXTUAL" = success ;;
            *) exit 1 ;;
          esac

  frontend:
    name: Frontend quality, build and E2E
    needs: [frontend-quality, frontend-e2e]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require all frontend validations
        env:
          QUALITY: ${{ needs.frontend-quality.result }}
          E2E: ${{ needs.frontend-e2e.result }}
        run: |
          set -eu
          test "$QUALITY" = success
          test "$E2E" = success

  containers:
    name: Container builds
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: cp .env.example .env && docker compose --profile production config --quiet

      - name: Build backend image
        run: docker build -t xcalificator-backend ./backend

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t xcalificator-web .

      - name: Build isolated document converter
        run: docker build -f document-renderer/Dockerfile -t xcalificator-document-renderer .

      - name: Verify converter isolation and real DOCX conversion
        run: python document-renderer/check_isolation.py --image xcalificator-document-renderer
