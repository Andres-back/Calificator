name: Spec governance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    name: Spec governance
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install governance test dependency
        run: python -m pip install pytest==9.1.1

      - name: Test governance validator
        run: python -m pytest tests/spec_governance -q

      - name: Validate pull request specification
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/check_spec_governance.py
          --base origin/${{ github.base_ref }}
          --head ${{ github.event.pull_request.head.sha }}
          --event-path "$GITHUB_EVENT_PATH"

      - name: Reject direct pushes to main
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          count="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq 'length')"
          if [ "$count" -lt 1 ]; then
            echo "El commit de main no está asociado a un pull request." >&2
            exit 1
          fi