services:
  encuesta-docente:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8092:8092"
    volumes:
      - respuestas:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; [urllib.request.urlopen('http://127.0.0.1:8092'+os.environ.get(key,default).rstrip('/')+'/health',timeout=3).close() for key,default in [('BASE_PATH','/encuesta-docente'),('FEEDBACK_BASE_PATH','/retroalimentacion-piloto')]]"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  respuestas:
