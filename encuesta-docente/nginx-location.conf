# Dentro del bloque server HTTPS existente. Aplicación independiente.
# La barra final de proxy_pass se omite para conservar el prefijo.
location = /encuesta-docente {
    return 302 /encuesta-docente/;
}
location ^~ /encuesta-docente/ {
    proxy_pass http://127.0.0.1:8092;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 384k;
    proxy_read_timeout 45s;
    add_header Cache-Control "no-store" always;
}
