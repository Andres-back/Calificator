x-backend-build: &backend-build
  context: ./backend
  args:
    APP_UID: ${APP_UID:-1000}
    APP_GID: ${APP_GID:-1000}

services:
  storage-init:
    build: *backend-build
    user: "0:0"
    environment:
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
    command:
      - sh
      - -c
      - "mkdir -p /app/uploads/presentaciones && chown -R $${APP_UID}:$${APP_GID} /app/uploads/presentaciones && chmod -R u+rwX,g+rwX /app/uploads/presentaciones"
    volumes:
      - ./uploads:/app/uploads
    restart: "no"


  migrate:
    build: *backend-build
    command: alembic upgrade head
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: *backend-build
    command: >-
      gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      -w ${BACKEND_WORKERS:-2}
      -b 0.0.0.0:8000
      --access-logfile -
      --error-logfile -
    env_file:
      - .env
    environment:
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      presenton:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker:
    build: *backend-build
    command: celery -A app.workers.worker.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2}
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      presenton:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "celery -A app.workers.worker.celery_app inspect ping --destination celery@$$HOSTNAME --timeout=5 | grep -q pong"
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 45s
    restart: unless-stopped

  beat:
    build: *backend-build
    command: celery -A app.workers.worker.celery_app beat --loglevel=info
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16@sha256:131dcf7ff6a900545df8e7e092c270aa8c6db2f2c818e408cb45ec21316b74e6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xcalificator_db}
      POSTGRES_USER: ${POSTGRES_USER:-xcalificator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  presenton:
    build:
      context: .
      dockerfile: presenton.Dockerfile
    image: xcalificator-presenton:2026-07
    depends_on:
      storage-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${PRESENTON_DATABASE_URL:-sqlite:////app_data/presenton.db}
      APP_DATA_DIRECTORY: /app_data
      USER_CONFIG_PATH: ${PRESENTON_USER_CONFIG_PATH:-/app_data/userConfig.json}
      FASTAPI_PUBLIC_URL: http://presenton:80
      NEXT_PUBLIC_URL: http://presenton:80
      NEXT_PUBLIC_FAST_API: http://presenton:80
      MIGRATE_DATABASE_ON_STARTUP: "true"
      AUTH_USERNAME: ${PRESENTON_AUTH_USERNAME:-presenton_admin}
      AUTH_PASSWORD: ${PRESENTON_AUTH_PASSWORD:?PRESENTON_AUTH_PASSWORD is required}
      AUTH_OVERRIDE_FROM_ENV: ${PRESENTON_AUTH_OVERRIDE_FROM_ENV:-true}
      RESET_AUTH: ${PRESENTON_RESET_AUTH:-false}
      DISABLE_IMAGE_GENERATION: "true"
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: ${PRESENTON_PUPPETEER_EXECUTABLE_PATH:-/usr/bin/chromium}
      CHROME_BIN: ${PRESENTON_PUPPETEER_EXECUTABLE_PATH:-/usr/bin/chromium}
    volumes:
      - ./uploads/presentations:/app/uploads
      - ./uploads/presenton:/app_data
      - ./presenton-patches/get_layout_by_name.py:/app/servers/fastapi/templates/get_layout_by_name.py:ro
      - ./presenton-patches/export_utils.py:/app/servers/fastapi/utils/export_utils.py:ro
      - ./presenton-patches/modern/ImageAndDescriptionLayout.tsx:/app/servers/nextjs/app/presentation-templates/modern/ImageAndDescriptionLayout.tsx:ro
    ports:
      - "127.0.0.1:${PRESENTON_PORT:-5001}:80"
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/api/v1/auth/status"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest@sha256:d00473cb58f0082c07cd6ed0d326a8a86f443ab69c51f8fc2b1a41687d45c661
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: xcalificator-web:2026-07
    environment:
      SERVER_NAME: ${SERVER_NAME:-_}
      PRESENTON_AUTH_USERNAME: ${PRESENTON_AUTH_USERNAME:-presenton_admin}
      PRESENTON_AUTH_PASSWORD: ${PRESENTON_AUTH_PASSWORD:?PRESENTON_AUTH_PASSWORD is required}
      PRESENTON_BASIC_AUTH: ${PRESENTON_BASIC_AUTH:-}
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
      presenton:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    profiles:
      - production

volumes:
  pgdata:
  redisdata:
  ollama_data:
