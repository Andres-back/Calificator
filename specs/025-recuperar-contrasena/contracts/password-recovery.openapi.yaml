openapi: 3.1.0
info:
  title: Recuperación de contraseña y correo transaccional
  version: 1.0.0
paths:
  /api/auth/password-recovery/request:
    post:
      summary: Solicitar un enlace sin revelar si la cuenta existe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Respuesta neutral
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
  /api/auth/password-recovery/validate:
    post:
      summary: Validar un enlace antes de mostrar el formulario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 32 }
      responses:
        '200': { description: Vigente }
        '400': { description: Inválido, vencido, consumido o revocado }
  /api/auth/password-recovery/reset:
    post:
      summary: Consumir el enlace y reemplazar la contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, password_confirmation]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8, maxLength: 128 }
                password_confirmation: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '204': { description: Contraseña reemplazada y sesiones invalidadas }
        '400': { description: Enlace o contraseña no válidos }
  /api/admin/mail/config:
    get:
      summary: Leer configuración SMTP sin secreto
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Metadatos seguros
    put:
      summary: Crear o actualizar configuración SMTP global
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host, port, use_starttls, username, from_email]
              properties:
                host: { type: string }
                port: { type: integer, minimum: 1, maximum: 65535 }
                use_starttls: { type: boolean }
                username: { type: string }
                from_email: { type: string, format: email }
                password: { type: string, writeOnly: true }
      responses:
        '200': { description: Configuración segura, sin contraseña }
        '403': { description: Solo administradores }
  /api/admin/mail/test:
    post:
      summary: Probar SMTP enviando al remitente configurado
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Resultado seguro y latencia }
        '409': { description: Configuración incompleta }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token