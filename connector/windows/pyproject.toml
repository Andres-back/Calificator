[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xcalificator-ollama-connector"
version = "0.1.0"
description = "Conector saliente de Ollama local para XCalificator"
requires-python = ">=3.11"

[project.scripts]
xcalificator-ollama = "xcalificator_ollama_connector.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["xcalificator_ollama_connector*"]
